jenkins:
  numExecutors: 0
  mode: NORMAL
  slaveAgentPort: -1
  markupFormatter: plainText
  nodes:
    - permanent:
        name: mac-studio
        remoteFS: /Users/alicek106/jenkins-agent
        numExecutors: 1 # signing builds must not overlap: they share the user's keychain search list
        labelString: "ios macos-arm64 xcode-27-0"
        launcher:
          inbound:
            webSocket: true
        retentionStrategy: always
unclassified:
  location:
    url: "http://jenkins.alicek106.net/"
security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: match-password
              description: fastlane match MATCH_PASSWORD
              secret: "${jenkins-credentials-match-password}"
          - string:
              scope: GLOBAL
              id: gitea-webhook-token
              description: Bearer token of the app repos' Gitea push webhooks (ios-ci)
              secret: "${jenkins-credentials-gitea-webhook-token}"
          - string:
              scope: GLOBAL
              id: slack-webhook-url
              description: Slack incoming webhook URL for build failures
              secret: "${jenkins-credentials-slack-webhook-url}"
          - string:
              scope: GLOBAL
              id: appstore-connect-api-key
              description: App Store Connect API key (.p8 content) for build numbers and TestFlight uploads
              secret: "${jenkins-credentials-appstore-connect-api-key}"
jobs:
  - script: |
      pipelineJob('ios-ci') {
        description('main push of an app repo: verify, qa_debug, publish to builds.alicek106.com/<app key>/')
        parameters {
          stringParam('APP', '', 'app key = Gitea repo name, e.g. whatseat (ios-remote-build apps/<app key>.yml). The Gitea push webhook fills it from $.repository.name.')
          stringParam('APP_SHA', '', 'app commit SHA (40 hex). The Gitea push webhook fills it from $.after.')
        }
        properties {
          pipelineTriggers {
            triggers {
              genericTrigger {
                genericVariables {
                  genericVariable {
                    key('APP')
                    value('$.repository.name')
                  }
                  genericVariable {
                    key('APP_SHA')
                    value('$.after')
                  }
                  genericVariable {
                    key('APP_REF')
                    value('$.ref')
                  }
                }
                tokenCredentialId('gitea-webhook-token')
                // Only main pushes build; tag pushes, zero SHAs (ref deletion) and odd repo names do not.
                regexpFilterText('$APP_REF $APP_SHA $APP')
                regexpFilterExpression('^refs/heads/main (?!0{40})[0-9a-f]{40} [A-Za-z0-9][A-Za-z0-9._-]*$')
                causeString('$APP push $APP_SHA')
                printContributedVariables(false)
                printPostContent(false)
                silentResponse(false)
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://gitea.alicek106.net/alicek106/ios-remote-build.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
      pipelineJob('ios-candidate') {
        description('Release candidate, started by hand: verify, next build number, Release archive, Ad Hoc install page, Mac artifacts')
        parameters {
          stringParam('APP', '', 'app key, e.g. whatseat (ios-remote-build apps/<app key>.yml)')
          stringParam('APP_SHA', '', 'app commit SHA (40 hex), usually one that passed ios-ci')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://gitea.alicek106.net/alicek106/ios-remote-build.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile.candidate')
            lightweight(true)
          }
        }
      }
      pipelineJob('ios-upload') {
        description('App Store Connect upload, started by hand: App Store export of a stored candidate archive, upload, wait for processing')
        parameters {
          stringParam('CANDIDATE', '', 'stored candidate name <app key>-<version>-<build>-<sha7>, e.g. whatseat-1.5-4-3d4e6e9 (Mac ~/ios-build/artifacts/<app key>/candidate/)')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://gitea.alicek106.net/alicek106/ios-remote-build.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile.upload')
            lightweight(true)
          }
        }
      }
