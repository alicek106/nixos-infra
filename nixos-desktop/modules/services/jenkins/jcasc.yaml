jenkins:
  numExecutors: 0
  mode: NORMAL
  slaveAgentPort: -1
  markupFormatter: plainText
  nodes:
    - permanent:
        name: mac-studio
        remoteFS: /Users/alicek106/jenkins-agent
        numExecutors: 1 # signing builds must not overlap: they share the user's keychain search list
        labelString: "ios macos-arm64 xcode-27-0"
        launcher:
          inbound:
            webSocket: true
        retentionStrategy: always
unclassified:
  location:
    url: "http://jenkins.alicek106.net/"
security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: match-password
              description: fastlane match MATCH_PASSWORD
              secret: "${jenkins-credentials-match-password}"
          - string:
              scope: GLOBAL
              id: gitea-webhook-token
              description: Bearer token of the whatseat Gitea push webhook
              secret: "${jenkins-credentials-gitea-webhook-token}"
          - string:
              scope: GLOBAL
              id: slack-webhook-url
              description: Slack incoming webhook URL for build failures
              secret: "${jenkins-credentials-slack-webhook-url}"
          - string:
              scope: GLOBAL
              id: appstore-connect-api-key
              description: App Store Connect API key (.p8 content) for build numbers and TestFlight uploads
              secret: "${jenkins-credentials-appstore-connect-api-key}"
jobs:
  - script: |
      pipelineJob('kinnylog-ci') {
        description('whatseat main push: verify, qa_debug, publish to builds.alicek106.com')
        parameters {
          stringParam('WHATSEAT_SHA', '', 'whatseat commit SHA (40 hex). The Gitea push webhook fills it from $.after.')
        }
        properties {
          pipelineTriggers {
            triggers {
              genericTrigger {
                genericVariables {
                  genericVariable {
                    key('WHATSEAT_SHA')
                    value('$.after')
                  }
                  genericVariable {
                    key('WHATSEAT_REF')
                    value('$.ref')
                  }
                }
                tokenCredentialId('gitea-webhook-token')
                // Tag pushes and zero SHAs (ref deletion) do not build.
                regexpFilterText('$WHATSEAT_REF $WHATSEAT_SHA')
                regexpFilterExpression('^refs/heads/main (?!0{40})[0-9a-f]{40}$')
                causeString('whatseat push $WHATSEAT_SHA')
                printContributedVariables(false)
                printPostContent(false)
                silentResponse(false)
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://gitea.alicek106.net/alicek106/ios-remote-build.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
      pipelineJob('kinnylog-candidate') {
        description('Release candidate, started by hand: verify, next build number, Release archive, Ad Hoc install page, Mac Studio artifacts')
        parameters {
          stringParam('WHATSEAT_SHA', '', 'whatseat commit SHA (40 hex), usually one that passed kinnylog-ci')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://gitea.alicek106.net/alicek106/ios-remote-build.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile.candidate')
            lightweight(true)
          }
        }
      }
      pipelineJob('kinnylog-upload') {
        description('App Store Connect upload, started by hand: App Store export of a stored candidate archive, upload, wait for processing')
        parameters {
          stringParam('CANDIDATE', '', 'stored candidate name <version>-<build>-<sha7>, e.g. 1.5-3-abc1234 (Mac Studio ~/ios-build/artifacts/candidate/)')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('http://gitea.alicek106.net/alicek106/ios-remote-build.git')
                }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile.upload')
            lightweight(true)
          }
        }
      }
