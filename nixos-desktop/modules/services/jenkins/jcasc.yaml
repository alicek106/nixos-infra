jenkins:
  numExecutors: 0
  mode: NORMAL
  slaveAgentPort: -1
  markupFormatter: plainText
  nodes:
    - permanent:
        name: mac-studio
        remoteFS: /Users/alicek106/jenkins-agent
        numExecutors: 1
        labelString: "ios macos-arm64 xcode-27-0"
        launcher:
          inbound:
            webSocket: true
        retentionStrategy: always
unclassified:
  location:
    url: "http://jenkins.alicek106.net/"
security:
  apiToken:
    creationOfLegacyTokenEnabled: false
    tokenGenerationOnCreationEnabled: false
    usageStatisticsEnabled: true
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: match-password
              description: fastlane match MATCH_PASSWORD
              secret: "${jenkins-credentials-match-password}"
